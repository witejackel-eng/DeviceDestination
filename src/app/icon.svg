  <path d="M7 7 C18 7, 20 13, 20 20 C20 27, 18 33, 7 33" stroke="#111214" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right D outline — opens toward center, mirrored -->
