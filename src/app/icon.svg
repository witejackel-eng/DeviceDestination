  <!-- Dot accents at D corners -->
  <circle cx="7" cy="7" r="1.2" fill="#111214" opacity="0.35"/>
  <circle cx="7" cy="33" r="1.2" fill="#111214" opacity="0.35"/>
  <circle cx="33" cy="7" r="1.2" fill="#111214" opacity="0.35"/>
  <circle cx="33" cy="33" r="1.2" fill="#111214" opacity="0.35"/>
