name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Test suite ────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devicedestination_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devicedestination_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devicedestination_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long-for-testing
      BETTER_AUTH_URL: http://localhost:3000
      ADMIN_EMAILS: admin@example.test
      CRON_SECRET: ci-cron-secret-value-for-testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL…"
            sleep 2
          done
          echo "PostgreSQL is ready"

      - name: Run migrations against test DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devicedestination_test
        run: npx drizzle-kit migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (placeholder)
        run: npm run test:integration

      - name: Validate product data
        run: npm run products:validate

      - name: Validate theme
        run: npm run theme:validate

      - name: Build
        run: npm run build

      - name: Audit dependencies (high/critical only)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── Security scan ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for committed .env files with secrets
        run: |
          # Look for any .env files (excluding .env.example, .env.template, etc.)
          FOUND=0
          for file in $(git ls-files | grep -E '^\.env$|\.env\.local$|\.env\.production$|\.env\.staging$|\.env\.development$'); do
            echo "::error::Secret file detected in commit: $file"
            FOUND=1
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Committed .env files containing secrets were found!"
            exit 1
          fi
          echo "✅ No committed .env files with secrets detected"

      - name: Scan for secret patterns in code
        run: |
          # Scan for private keys, tokens, passwords — but exclude test fixtures & .env.example
          SECRETS_FOUND=0

          # ----- RSA / SSH private keys -----
          if git ls-files | xargs grep -lE '-----BEGIN (RSA |EC |DSA |OPENSSH )PRIVATE KEY-----' \
            -- '.env.example' ':!tests/' ':!**/test-fixtures/' 2>/dev/null; then
            echo "::error::Private key detected in committed code"
            SECRETS_FOUND=1
          fi

          # ----- Hardcoded tokens / API keys (rough heuristic) -----
          if git ls-files | xargs grep -lE '(AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24}|rk_live_[0-9a-zA-Z]{24}|ghp_[0-9a-zA-Z]{36})' \
            -- '.env.example' ':!tests/' ':!**/test-fixtures/' 2>/dev/null; then
            echo "::error::Hardcoded secret token detected in committed code"
            SECRETS_FOUND=1
          fi

          # ----- Hardcoded passwords (common pattern) -----
          if git ls-files | xargs grep -lE '(password\s*=\s*["\'][^"\']{8,}["\'])' \
            -- '.env.example' ':!tests/' ':!**/test-fixtures/' ':!tests/unit/security.test.ts' 2>/dev/null; then
            echo "::error::Hardcoded password detected in committed code"
            SECRETS_FOUND=1
          fi

          if [ "$SECRETS_FOUND" -eq 1 ]; then
            echo "❌ Secret patterns detected in committed code!"
            exit 1
          fi
          echo "✅ No secret patterns detected in committed code"
