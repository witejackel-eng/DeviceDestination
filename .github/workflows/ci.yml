name: CI

on:
  push:
    branches: [main, "backend-**"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  POSTGRES_VERSION: "16"

jobs:
  # ─── Lint + Typecheck ────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ─── Unit tests (no DB needed) ───────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test -- --reporter=verbose
        env:
          NODE_ENV: test

  # ─── Integration tests (real PostgreSQL) ─────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devicedestination_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devicedestination_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devicedestination_test
      DB_DRIVER: node-postgres
      RAZORPAY_KEY_ID: test_key_id
      RAZORPAY_KEY_SECRET: test_key_secret
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
      NEXT_PUBLIC_RAZORPAY_KEY_ID: test_key_id
      BETTER_AUTH_SECRET: test_auth_secret_for_integration_tests
      ADMIN_EMAILS: admin@test.com
      NEXT_PUBLIC_SITE_URL: https://test.devicedestination.com
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Apply migrations
        run: |
          for f in drizzle/0000_*.sql drizzle/0001_*.sql drizzle/0002_*.sql drizzle/0003_*.sql drizzle/0004_*.sql drizzle/0005_*.sql drizzle/0006_*.sql drizzle/0007_*.sql drizzle/0008_*.sql; do
            echo "Applying $f..."
            PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d devicedestination_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Schema consistency check
        run: npx drizzle-kit check || true

      - name: Run integration tests
        run: npm run test:integration -- --reporter=verbose

  # ─── Product data validation ─────────────────────────────────────────────
  product-validation:
    name: Product Data Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run products:validate

  # ─── Theme validation ────────────────────────────────────────────────────
  theme-validation:
    name: Theme Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run theme:validate

  # ─── Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://devicedestination.com
      NEXT_PUBLIC_RAZORPAY_KEY_ID: test_key_id
      BETTER_AUTH_SECRET: test_auth_secret_for_build
      ADMIN_EMAILS: admin@test.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build

  # ─── Security: secret scan ───────────────────────────────────────────────
  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: |
          # Scan for common secret patterns. Fails if any are found.
          FOUND=0
          patterns=(
            "ghp_[0-9a-zA-Z]{36}"
            "gho_[0-9a-zA-Z]{36}"
            "sk_live_[0-9a-zA-Z]{24}"
            "rk_live_[0-9a-zA-Z]{24}"
            "AKIA[0-9A-Z]{16}"
            "xox[baprs]-[0-9a-zA-Z-]+"
          )
          for pattern in "${patterns[@]}"; do
            if grep -rE "$pattern" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.env' --include='*.yml' --include='*.yaml' . 2>/dev/null | grep -v node_modules | grep -v '.git/'; then
              echo "ERROR: Secret pattern '$pattern' found in source files"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No secret patterns found."

  # ─── Security: no committed env files ────────────────────────────────────
  no-env-files:
    name: No Committed Env Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed .env files
        run: |
          # .env.example is allowed; .env, .env.local, .env.production etc. are not.
          if find . -name ".env" -o -name ".env.local" -o -name ".env.production" -o -name ".env.development" | grep -v node_modules | grep -v .git/; then
            echo "ERROR: Committed env file found (only .env.example is allowed)"
            exit 1
          fi
          echo "No committed env files found."

  # ─── Dependency audit (high/critical must fail) ──────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high || true
      # Note: npm audit exits non-zero if any vulnerability is found at the
      # specified level. We use `|| true` above to report without failing,
      # and add a stricter check below for critical only.
      - name: Fail on critical vulnerabilities
        run: npm audit --audit-level=critical
